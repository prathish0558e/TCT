      // Apply saved theme before first paint so there is never a light flash.
      (function () {
        try {
          var t = localStorage.getItem("tct-theme");
          if (t === "night" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("tct-night");
          }
        } catch (e) {}
      })();
    </script>
